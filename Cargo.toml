[package]
name = "breezydb"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
axum = { version = "0.8.9", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
turso = "0.8.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
