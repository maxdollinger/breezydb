[package]
name = "breezydb"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32c = "0.6"
rand = "0.10.2"
libc = "0.2.189"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
axum = { version = "0.8.9", features = ["tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
